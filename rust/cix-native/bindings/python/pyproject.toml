[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cix-native"
version = "0.1.0"
description = "Optional stdlib ctypes binding for the installed CIX native C ABI"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
numcodecs = ["numcodecs==0.16.3"]
zarr = ["numcodecs==0.16.3", "zarr==3.1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
